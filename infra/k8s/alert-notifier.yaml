apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-notifier
  namespace: dsbd-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-notifier
  template:
    metadata:
      labels:
        app: alert-notifier
    spec:
      containers:
        - name: alert-notifier
          image: alert-notifier:hw3
          imagePullPolicy: IfNotPresent

          # Prendo env generali (Kafka bootstrap + SMTP host/port/user/from/tls, ecc.)
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets

          # Fix compatibilità: il tuo codice usa SMTP_USERNAME
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"

            - name: SMTP_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SMTP_USER

            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SMTP_PASSWORD

          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
